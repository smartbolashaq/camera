<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трансляция цеха</title>

<!--
  ═══════════════════════════════════════════════════════════════════
  id трансляции больше НЕ вписывается в этот файл.
  Он лежит рядом, в stream.json, и меняется командой /id в телеграм-боте.
  Здесь меняют только название и подпись, они помечены словом ЗАМЕНИТЬ.
  ═══════════════════════════════════════════════════════════════════
-->

<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #262b35;
    --text: #e6e8ec;
    --muted: #9aa1ad;
    --accent: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  header {
    display: flex; align-items: baseline; flex-wrap: wrap;
    gap: 12px; margin-bottom: 8px;
  }
  h1 { font-size: 1.5rem; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .live {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 0.75rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--accent);
    background: rgba(74, 222, 128, 0.1);
    border: 1px solid rgba(74, 222, 128, 0.25);
    border-radius: 999px; padding: 4px 11px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }
  .player {
    position: relative; aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden;
  }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .placeholder {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: 24px; text-align: center;
    color: var(--muted); font-size: 0.95rem;
  }
  .note {
    margin-top: 18px; padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--muted); font-size: 0.9rem;
  }
  footer { margin-top: 28px; color: var(--muted); font-size: 0.82rem; }
  @media (max-width: 520px) {
    h1 { font-size: 1.25rem; }
    body { padding: 16px 16px 40px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <!-- ЗАМЕНИТЬ: название -->
    <h1>Цех, прямая трансляция</h1>
    <span class="live"><span class="dot"></span>В эфире</span>
  </header>

  <!-- ЗАМЕНИТЬ: подпись, или удали строку целиком -->
  <p class="sub">Камера работает круглосуточно. Задержка около 20 секунд.</p>

  <div class="player" id="player">
    <div class="placeholder">Загружаю трансляцию…</div>
  </div>

  <div class="note" id="hint">
    Если картинки нет, трансляция временно остановлена. Обнови страницу через пару минут.
  </div>

  <footer>
    <!-- ЗАМЕНИТЬ или удали -->
    Smart Bolashaq
  </footer>

</div>

<script>
/* ═══════════════════════ НАСТРОЙКА ═══════════════════════
 *
 * Обычно здесь ничего менять не надо.
 *
 * id трансляции страница берёт из файла stream.json, который лежит
 * рядом. Его обновляет телеграм-бот командой /id, поэтому при смене
 * трансляции код трогать не нужно.
 *
 * FALLBACK_ID — запасной id на случай, если stream.json не прочитался.
 * Впиши туда текущий id один раз, дальше он не понадобится.
 */

const SOURCE      = "stream.json";
const FALLBACK_ID = "";

/* ═════════════════ ниже менять не нужно ═════════════════ */

(async function () {
  const player = document.getElementById("player");
  const hint = document.getElementById("hint");

  let videoId = FALLBACK_ID;
  let updated = null;

  try {
    const resp = await fetch(SOURCE + "?t=" + Date.now(), { cache: "no-store" });
    if (resp.ok) {
      const data = await resp.json();
      if (data && typeof data.videoId === "string" && /^[A-Za-z0-9_-]{11}$/.test(data.videoId)) {
        videoId = data.videoId;
        updated = data.updated || null;
      }
    }
  } catch (err) {
    // stream.json недоступен, останемся на запасном id
  }

  if (!videoId) {
    player.innerHTML =
      '<div class="placeholder">Трансляция пока не настроена.<br>' +
      'Отправь боту команду /id со ссылкой на трансляцию.</div>';
    hint.textContent = "Как только id будет задан, картинка появится здесь автоматически.";
    return;
  }

  player.innerHTML = "";
  const frame = document.createElement("iframe");
  frame.src = "https://www.youtube.com/embed/" + encodeURIComponent(videoId) +
              "?autoplay=1&mute=1&rel=0&playsinline=1";
  frame.title = "Трансляция цеха";
  frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  frame.allowFullscreen = true;
  player.appendChild(frame);

  if (updated) {
    const when = new Date(updated);
    if (!isNaN(when)) {
      hint.textContent =
        "Если картинки нет, трансляция временно остановлена. Обнови страницу через пару минут. " +
        "Ссылка обновлялась " + when.toLocaleString("ru-RU") + ".";
    }
  }
})();
</script>
</body>
</html>
